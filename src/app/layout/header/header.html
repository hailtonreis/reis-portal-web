<header
  class="fixed top-0 left-0 right-0 z-50 border-b border-slate-800/60 bg-slate-950/80 backdrop-blur-md">

  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-6">

    <!-- Logo -->
    <a
      routerLink="/"
      class="flex items-center gap-3">

      <div
        class="flex h-10 w-10 items-center justify-center rounded-xl bg-sky-500 text-lg font-bold text-white shadow-lg shadow-sky-500/30">
        R
      </div>

      <div>
        <div class="text-lg font-bold text-white">
          Reis Portal
        </div>

        <div class="text-xs text-slate-400">
          Plataforma Pessoal
        </div>
      </div>

    </a>

    <!-- Menu Desktop -->
    <nav class="hidden items-center gap-8 md:flex">

      <a
        href="#"
        class="text-sm font-medium text-slate-300 transition hover:text-white">
        Recursos
      </a>

      <a
        href="#"
        class="text-sm font-medium text-slate-300 transition hover:text-white">
        Roadmap
      </a>

      <a
        href="#"
        class="text-sm font-medium text-slate-300 transition hover:text-white">
        Sobre
      </a>

      <!-- Entrar -->
      <a
        *ngIf="mostrarBotaoEntrar"
        routerLink="/login"
        class="inline-flex items-center justify-center rounded-lg border border-slate-600 px-5 py-2 text-sm font-medium text-slate-200 transition-all duration-200 hover:border-sky-500 hover:bg-sky-500 hover:text-white">

        Entrar

      </a>

      <!-- Voltar -->
      <a
        *ngIf="mostrarBotaoVoltarInicio"
        routerLink="/"
        class="inline-flex items-center justify-center rounded-lg border border-slate-600 px-5 py-2 text-sm font-medium text-slate-200 transition-all duration-200 hover:border-slate-500 hover:bg-slate-800 hover:text-white">

        ← Voltar ao início

      </a>

      <!-- Sair -->
      <button
        *ngIf="mostrarBotaoSair"
        type="button"
        (click)="logout()"
        class="inline-flex items-center justify-center rounded-lg border border-red-600 px-5 py-2 text-sm font-medium text-red-300 transition-all duration-200 hover:bg-red-600 hover:text-white">

        Sair

      </button>

    </nav>

    <!-- Botão Mobile -->
    <button
      type="button"
      class="text-2xl text-white transition hover:text-sky-400 md:hidden"
      (click)="alternarMenu()">

      ☰

    </button>

  </div>

  <!-- Menu Mobile -->
  <nav
    *ngIf="menuAberto"
    class="absolute left-0 top-16 w-full border-t border-slate-800 bg-slate-950 px-6 py-4 shadow-xl md:hidden">

    <a
      href="#"
      class="block py-3 text-slate-300 transition hover:text-white">
      Recursos
    </a>

    <a
      href="#"
      class="block py-3 text-slate-300 transition hover:text-white">
      Roadmap
    </a>

    <a
      href="#"
      class="block py-3 text-slate-300 transition hover:text-white">
      Sobre
    </a>

    <!-- Entrar -->
    <a
      *ngIf="mostrarBotaoEntrar"
      routerLink="/login"
      (click)="menuAberto = false"
      class="mt-4 block rounded-lg border border-slate-700 px-4 py-2.5 text-center text-sm font-medium text-slate-200 transition-all duration-200 hover:border-sky-500 hover:bg-sky-500 hover:text-white">

      Entrar

    </a>

    <!-- Voltar -->
    <a
      *ngIf="mostrarBotaoVoltarInicio"
      routerLink="/"
      (click)="menuAberto = false"
      class="mt-4 block rounded-lg border border-slate-700 px-4 py-2.5 text-center text-sm font-medium text-slate-200 transition-all duration-200 hover:border-slate-500 hover:bg-slate-800 hover:text-white">

      ← Voltar ao início

    </a>

    <!-- Sair -->
    <button
      *ngIf="mostrarBotaoSair"
      type="button"
      (click)="logout()"
      class="mt-4 block w-full rounded-lg border border-red-600 px-4 py-2.5 text-center text-sm font-medium text-red-300 transition-all duration-200 hover:bg-red-600 hover:text-white">

      Sair

    </button>

  </nav>

</header>
