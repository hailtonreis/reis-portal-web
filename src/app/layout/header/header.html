<header
  class="fixed top-0 left-0 right-0 z-50 border-b border-slate-200 bg-white/90 backdrop-blur">

  <div
    class="mx-auto flex h-20 max-w-7xl items-center justify-between px-6 lg:px-8">


    <!-- LOGO -->

    <a
      routerLink="/"
      class="flex items-center gap-4">

      <div
        class="flex h-12 w-12 items-center justify-center overflow-hidden rounded-xl bg-sky-600">

        <img
          (click)="voltarAoTopo($event)"
          src="assets/images/logo.png"
          alt="Reis Portal"
          class="h-9 w-9 object-contain" />

      </div>


      <div>

        <div
          class="text-xl font-bold text-slate-900">

          Reis

          <span class="text-rose-700">
            Portal
          </span>

        </div>


        <div
          class="text-xs uppercase tracking-widest text-slate-500">

          Soluções Digitais

        </div>

      </div>

    </a>



    <!-- MENU DESKTOP -->

    <nav
      class="hidden items-center gap-10 lg:flex">

      <a
        href="#solucoes"
        class="font-medium text-slate-600 hover:text-sky-600">
        Soluções
      </a>

      <a
        href="#segmentos"
        class="font-medium text-slate-600 hover:text-sky-600">
        Segmentos
      </a>

      <a
        href="#portfolio"
        class="font-medium text-slate-600 hover:text-sky-600">
        Portfólio
      </a>

      <a
        href="#sobre"
        class="font-medium text-slate-600 hover:text-sky-600">
        Sobre
      </a>

      <a
        href="#contato"
        class="font-medium text-slate-600 hover:text-sky-600">
        Contato
      </a>

    </nav>



    <!-- BOTÃO DESKTOP -->

    <a
      href="https://wa.me/5561991191500?text=Olá,%20gostaria%20de%20solicitar%20uma%20demonstração%20das%20soluções%20digitais%20da%20Reis."
      target="_blank"
      rel="noopener noreferrer"
      class="hidden lg:inline-flex items-center justify-center rounded-xl bg-sky-600 px-6 py-3 font-semibold text-white transition-all duration-300 hover:bg-sky-700 hover:shadow-lg hover:shadow-sky-300/40">

      Solicitar Orçamento

    </a>



    <!-- BOTÃO MENU MOBILE -->

    <button
      type="button"
      class="rounded-lg p-2 text-slate-700 lg:hidden"
      (click)="alternarMenu()">

      <span class="text-3xl">
        ☰
      </span>

    </button>


  </div>



  <!-- MENU MOBILE -->

  <div
    *ngIf="menuAberto"
    class="border-t border-slate-200 bg-white px-6 py-6 lg:hidden">


    <nav
      class="flex flex-col gap-5">


      <a
        href="#solucoes"
        (click)="alternarMenu()"
        class="font-medium text-slate-600 hover:text-sky-600">
        Soluções
      </a>


      <a
        href="#segmentos"
        (click)="alternarMenu()"
        class="font-medium text-slate-600 hover:text-sky-600">
        Segmentos
      </a>


      <a
        href="#portfolio"
        (click)="alternarMenu()"
        class="font-medium text-slate-600 hover:text-sky-600">
        Portfólio
      </a>


      <a
        href="#sobre"
        (click)="alternarMenu()"
        class="font-medium text-slate-600 hover:text-sky-600">
        Sobre
      </a>


      <a
        href="#contato"
        (click)="alternarMenu()"
        class="font-medium text-slate-600 hover:text-sky-600">
        Contato
      </a>


      <a
        href="https://wa.me/5561991191500"
        target="_blank"
        class="mt-3 rounded-xl bg-sky-600 px-5 py-3 text-center font-semibold text-white">

        Solicitar Orçamento

      </a>


    </nav>


  </div>


</header>
