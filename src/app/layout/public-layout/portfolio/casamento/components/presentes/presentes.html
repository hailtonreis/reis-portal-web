<section
  id="presentes"
class="scroll-mt-32 bg-white pt-24 pb-16 sm:pt-28 sm:pb-24">
  <div
    class="mx-auto max-w-7xl px-5 sm:px-6">
    <div
      class="mx-auto mb-10 max-w-3xl text-center sm:mb-14">
      <span
        class="inline-block rounded-full bg-rose-100 px-5 py-2 text-sm font-semibold text-rose-700">
        Lista de Presentes
      </span>
      <h2
        class="mt-6 text-3xl font-light leading-tight text-slate-900 sm:text-4xl md:text-5xl">
        {{ presentes.titulo }}
      </h2>
      <p
        class="mt-6 text-base leading-7 text-slate-600 sm:text-lg sm:leading-8">
        {{ presentes.descricao }}
      </p>
    </div>
    <div
      class="grid gap-6 md:grid-cols-3 md:gap-8">
      <div
        *ngFor="let opcao of presentes.opcoes"
        class="group rounded-3xl bg-white p-6 text-center shadow-lg transition duration-300 hover:-translate-y-2 hover:shadow-2xl sm:p-8">
        <div
          class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-rose-100 text-3xl text-rose-700 transition group-hover:scale-110 sm:h-20 sm:w-20 sm:text-4xl">
          {{ opcao.icone }}
        </div>
        <h3
          class="mt-6 text-2xl font-semibold text-slate-900 sm:mt-8 sm:text-3xl">
          {{ opcao.titulo }}
        </h3>
        <p
          class="mt-4 leading-7 text-slate-600">
          {{ opcao.descricao }}
        </p>
        <button
          class="mt-8 rounded-xl bg-rose-600 px-7 py-3 font-semibold text-white transition hover:bg-rose-700 hover:shadow-lg hover:shadow-rose-300/40">
          {{ opcao.botao }}
        </button>
      </div>
    </div>
    <div
      class="mt-12 rounded-3xl bg-white p-6 shadow-lg sm:mt-16 sm:p-10">
      <div
        class="grid items-center gap-10 lg:grid-cols-2">
        <div>
          <h3
            class="text-3xl font-light text-slate-900 sm:text-4xl">
            {{ presentes.pix.titulo }}
          </h3>
          <p
            class="mt-5 leading-7 text-slate-600 sm:mt-6 sm:leading-8">
            {{ presentes.pix.descricao }}
          </p>
          <div
            class="mt-6 rounded-2xl bg-rose-50 p-5 sm:mt-8 sm:p-6">
            <p
              class="font-semibold text-rose-700">
              Chave Pix
            </p>
            <p
              class="mt-3 break-all text-base text-slate-700 sm:text-lg">
              {{ presentes.pix.chave }}
            </p>
          </div>
        </div>
        <div
          class="flex justify-center">
          <div
            class="flex h-52 w-52 items-center justify-center rounded-3xl border border-rose-200 bg-rose-50 sm:h-64 sm:w-64">
            <div
              class="text-center">
              <div
                class="text-5xl font-light text-rose-600">
                ♡
              </div>
              <p
                class="mt-4 text-xs uppercase tracking-widest text-slate-500">
                Reis Portal
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
