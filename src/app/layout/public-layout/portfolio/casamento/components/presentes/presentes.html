<section
  id="presentes"
  class="bg-rose-50 py-24">

  <div
    class="mx-auto max-w-7xl px-6">

    <!-- Cabeçalho -->

    <div
      class="mx-auto mb-16 max-w-3xl text-center">

      <span
        class="rounded-full bg-white px-5 py-2 text-sm font-semibold text-rose-700 shadow">

        Lista de Presentes

      </span>

      <h2
        class="mt-6 text-5xl font-light text-slate-900">

        {{ presentes.titulo }}

      </h2>

      <p
        class="mt-6 text-lg leading-8 text-slate-600">

        {{ presentes.descricao }}

      </p>

    </div>

    <!-- Cards -->

    <div
      class="grid gap-8 md:grid-cols-3">

      <div
        *ngFor="let opcao of presentes.opcoes"
        class="rounded-3xl bg-white p-10 text-center shadow-lg transition duration-300 hover:-translate-y-2 hover:shadow-2xl">

        <!-- Ícone -->

        <div
          class="mx-auto flex h-20 w-20 items-center justify-center rounded-full bg-rose-100 text-4xl font-light text-rose-700">

          {{ opcao.icone }}

        </div>

        <!-- Título -->

        <h3
          class="mt-8 text-3xl font-semibold text-slate-900">

          {{ opcao.titulo }}

        </h3>

        <!-- Descrição -->

        <p
          class="mt-5 leading-7 text-slate-600">

          {{ opcao.descricao }}

        </p>

        <!-- Botão -->

        <button
          class="mt-8 rounded-xl bg-rose-600 px-8 py-3 font-semibold text-white transition hover:bg-rose-700">

          {{ opcao.botao }}

        </button>

      </div>

    </div>

    <!-- Área Pix -->

    <div
      class="mt-16 rounded-3xl bg-white p-10 shadow-lg">

      <div
        class="grid items-center gap-10 lg:grid-cols-2">

        <!-- Texto -->

        <div>

          <h3
            class="text-4xl font-light text-slate-900">

            {{ presentes.pix.titulo }}

          </h3>

          <p
            class="mt-6 leading-8 text-slate-600">

            {{ presentes.pix.descricao }}

          </p>

          <div
            class="mt-8 rounded-2xl bg-rose-50 p-6">

            <p
              class="font-semibold text-rose-700">

              Chave Pix

            </p>

            <p
              class="mt-3 break-all text-lg text-slate-700">

              {{ presentes.pix.chave }}

            </p>

          </div>

        </div>

        <!-- Área ilustrativa -->

        <div
          class="flex justify-center">

          <div
            class="flex h-64 w-64 items-center justify-center rounded-3xl border border-rose-200 bg-rose-50">

            <div
              class="text-center">

              <div
                class="text-5xl font-light text-rose-600">

                ♡

              </div>

              <p
                class="mt-4 text-sm tracking-widest text-slate-500 uppercase">

                Reis Portal

              </p>

            </div>

          </div>

        </div>

      </div>

    </div>

  </div>

</section>
