<nav

      <div
        class="flex h-12 w-12 items-center justify-center overflow-hidden rounded-xl bg-sky-600">

        <img

          class="h-9 w-9 object-contain" />

      </div>


      <div>

        <div
          class="text-xl font-bold text-slate-900">

        </div>
