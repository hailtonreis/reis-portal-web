<nav
  class="fixed top-0 left-0 right-0 z-50 border-b border-rose-100 bg-white/90 backdrop-blur">


  <div
    class="mx-auto flex h-20 max-w-7xl items-center justify-between px-6 lg:px-8">


    <!-- LOGO -->

    <a
      routerLink="/"
      class="flex items-center gap-4">


      <div
        class="flex h-12 w-12 items-center justify-center overflow-hidden rounded-xl bg-sky-600">

        <img
          src="assets/images/logo.png"
          alt="Reis Portal"
          class="h-9 w-9 object-contain" />

      </div>


      <div>

        <div
          class="text-xl font-bold text-slate-900">

          Reis

          <span class="text-rose-700">
            Portal
          </span>

        </div>


        <div
          class="text-xs uppercase tracking-widest text-slate-500">

          Soluções Digitais

        </div>

      </div>


    </a>



    <!-- MENU DESKTOP -->

    <nav
      class="hidden items-center gap-8 lg:flex">


      <a
        *ngFor="let item of menuItems"
        [href]="'/casamento' + item.link"
        class="font-medium text-slate-600 transition hover:text-rose-600">

        {{ item.label }}

      </a>


    </nav>



    <!-- BOTÃO DESKTOP -->

    <button
      class="hidden rounded-xl bg-rose-600 px-6 py-3 font-semibold text-white transition-all duration-300 hover:bg-rose-700 hover:shadow-lg hover:shadow-rose-300/40 lg:block">

      Conheça o Produto

    </button>



    <!-- BOTÃO MOBILE -->

    <button
      type="button"
      class="rounded-lg p-2 text-slate-700 lg:hidden"
      (click)="alternarMenu()">


      <span class="text-3xl">
        ☰
      </span>


    </button>


  </div>



  <!-- MENU MOBILE -->

  <div
    *ngIf="menuAberto"
    class="border-t border-rose-100 bg-white px-6 py-6 lg:hidden">


    <nav
      class="flex flex-col gap-5">


      <a
        *ngFor="let item of menuItems"
        [href]="'/casamento' + item.link"
        (click)="alternarMenu()"
        class="font-medium text-slate-600 transition hover:text-rose-600">

        {{ item.label }}

      </a>



      <button
        class="mt-3 rounded-xl bg-rose-600 px-6 py-3 font-semibold text-white">

        Conheça o Produto

      </button>


    </nav>


  </div>


</nav>
