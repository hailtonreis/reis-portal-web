<section
  id="inicio"
  class="relative flex min-h-screen items-center justify-center overflow-hidden">


  <!-- Imagem -->

  <img
    src="assets/images/casal-hero.jpg"
    alt="Casal"
    class="absolute inset-0 h-full w-full object-cover object-center md:object-center" />


  <!-- Overlay -->

  <div
    class="absolute inset-0 bg-gradient-to-b from-black/40 via-black/30 to-black/70">
  </div>



  <!-- Conteúdo -->

  <div
    class="relative z-10 mx-auto max-w-5xl px-5 pt-24 text-center text-white">


    <!-- Data -->

    <span
      class="inline-block rounded-full border border-white/40 bg-white/20 px-5 py-2 text-sm backdrop-blur">

      {{ casamento.data }}

    </span>



    <!-- Nomes -->

    <h1
      class="mt-8 text-4xl font-light tracking-wide sm:text-5xl md:text-7xl">


      {{ casamento.noivo }}

      <span class="mx-2 text-rose-200 sm:mx-4">
        &
      </span>

      {{ casamento.noiva }}


    </h1>



    <!-- Frase -->

    <p
      class="mx-auto mt-6 max-w-2xl text-base leading-7 text-rose-100 sm:text-xl sm:leading-9">

      "{{ casamento.frase }}"

    </p>



    <!-- Contador -->

    <div
      class="mt-10 grid grid-cols-2 gap-3 sm:mt-16 sm:grid-cols-4 sm:gap-4">


      <div
        class="rounded-2xl bg-white/20 p-4 backdrop-blur sm:p-6">

        <div class="text-3xl font-bold sm:text-4xl">
          {{ contador.dias }}
        </div>

        <div class="mt-2 text-xs uppercase tracking-widest sm:text-sm">
          Dias
        </div>

      </div>



      <div
        class="rounded-2xl bg-white/20 p-4 backdrop-blur sm:p-6">

        <div class="text-3xl font-bold sm:text-4xl">
          {{ contador.horas }}
        </div>

        <div class="mt-2 text-xs uppercase tracking-widest sm:text-sm">
          Horas
        </div>

      </div>



      <div
        class="rounded-2xl bg-white/20 p-4 backdrop-blur sm:p-6">

        <div class="text-3xl font-bold sm:text-4xl">
          {{ contador.minutos }}
        </div>

        <div class="mt-2 text-xs uppercase tracking-widest sm:text-sm">
          Minutos
        </div>

      </div>



      <div
        class="rounded-2xl bg-white/20 p-4 backdrop-blur sm:p-6">

        <div class="text-3xl font-bold sm:text-4xl">
          {{ contador.segundos }}
        </div>

        <div class="mt-2 text-xs uppercase tracking-widest sm:text-sm">
          Segundos
        </div>

      </div>


    </div>



    <!-- Botões -->

    <div
      class="mt-10 flex flex-col justify-center gap-4 sm:mt-14 sm:flex-row">


      <button
        class="rounded-xl bg-rose-600 px-8 py-4 font-semibold text-white transition hover:bg-rose-700">

        Confirmar Presença

      </button>



      <button
        class="rounded-xl border border-white bg-white/10 px-8 py-4 font-semibold backdrop-blur transition hover:bg-white/20">

        Ver Lista de Presentes

      </button>


    </div>


  </div>


</section>
