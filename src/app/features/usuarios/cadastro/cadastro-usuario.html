<app-header></app-header>

<div class="min-h-screen bg-gray-100">

  <div class="flex justify-center px-6 pt-28 pb-10">

    <div class="w-full max-w-sm rounded-xl bg-white p-7 shadow-xl">

      <div class="mb-7 text-center">

        <h1 class="text-2xl font-bold text-gray-800">
          Criar conta
        </h1>

        <p class="mt-2 text-sm text-gray-500">
          Cadastre-se no Reis Portal
        </p>

      </div>

      <form
        [formGroup]="formulario"
        (ngSubmit)="cadastrar()"
        class="space-y-4">

        <!-- Nome -->
        <div>
          <label class="block text-sm font-medium text-gray-700">
            Nome completo
          </label>

          <input
            type="text"
            formControlName="nome"
            placeholder="Digite seu nome"
            class="mt-1 w-full rounded-lg border border-gray-300 px-4 py-3 shadow-sm
                   transition focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- Usuário -->
        <div>
          <label class="block text-sm font-medium text-gray-700">
            Usuário
          </label>

          <input
            type="text"
            formControlName="username"
            placeholder="Digite seu usuário"
            class="mt-1 w-full rounded-lg border border-gray-300 px-4 py-3 shadow-sm
                   transition focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- Email -->
        <div>
          <label class="block text-sm font-medium text-gray-700">
            E-mail
          </label>

          <input
            type="email"
            formControlName="email"
            placeholder="Digite seu e-mail"
            class="mt-1 w-full rounded-lg border border-gray-300 px-4 py-3 shadow-sm
                   transition focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- Senha -->
        <div>
          <label class="block text-sm font-medium text-gray-700">
            Senha
          </label>

          <input
            type="password"
            formControlName="senha"
            placeholder="Digite sua senha"
            class="mt-1 w-full rounded-lg border border-gray-300 px-4 py-3 shadow-sm
                   transition focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- Confirmar Senha -->
        <div>
          <label class="block text-sm font-medium text-gray-700">
            Confirmar senha
          </label>

          <input
            type="password"
            formControlName="confirmarSenha"
            placeholder="Confirme sua senha"
            class="mt-1 w-full rounded-lg border border-gray-300 px-4 py-3 shadow-sm
                   transition focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div
          *ngIf="mensagemErro"
          class="rounded-lg border border-red-300 bg-red-50 px-4 py-3 text-sm text-red-700">

          {{ mensagemErro }}

        </div>

        <button
          type="submit"
          [disabled]="carregando"
          class="w-full rounded-lg bg-blue-600 py-3 font-semibold text-white transition
                 hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-60">

          {{ carregando ? 'Cadastrando...' : 'Cadastrar' }}

        </button>

      </form>

      <div class="mt-6 border-t border-gray-200 pt-5 text-center">

        <span class="text-sm text-gray-600">
          Já possui uma conta?
        </span>

        <a
          routerLink="/login"
          class="ml-1 font-semibold text-blue-600 hover:text-blue-700 hover:underline">

          Entrar

        </a>

      </div>

    </div>

  </div>

</div>
