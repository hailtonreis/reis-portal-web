<div class="min-h-screen flex items-center justify-center bg-gray-100">

    <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8">

        <div class="text-center mb-8">

            <h1 class="text-3xl font-bold text-gray-800">
                Reis Portal
            </h1>

            <p class="text-gray-500 mt-2">
                Acesse sua conta
            </p>

        </div>


        <form (ngSubmit)="entrar()">


            <div class="mb-4">

                <label class="block text-sm font-medium text-gray-700">
                    Usuário
                </label>

                <input
                    type="text"
                    name="username"
                    [(ngModel)]="username"
                    class="mt-1 w-full rounded-lg border border-gray-300 p-3 focus:ring-2 focus:ring-blue-500"
                    placeholder="Digite seu usuário">

            </div>


            <div class="mb-6">

                <label class="block text-sm font-medium text-gray-700">
                    Senha
                </label>


                <div class="relative">

                    <input
                        [type]="mostrarSenha ? 'text' : 'password'"
                        name="senha"
                        [(ngModel)]="senha"
                        class="mt-1 w-full rounded-lg border border-gray-300 p-3 pr-12 focus:ring-2 focus:ring-blue-500"
                        placeholder="Digite sua senha">


                    <button
                        type="button"
                        (click)="mostrarSenha = !mostrarSenha"
                        class="absolute inset-y-0 right-0 flex items-center px-3 text-gray-500 hover:text-blue-600">


                        <lucide-icon
                            *ngIf="!mostrarSenha"
                            [img]="Eye"
                            size="20">
                        </lucide-icon>


                        <lucide-icon
                            *ngIf="mostrarSenha"
                            [img]="EyeOff"
                            size="20">
                        </lucide-icon>


                    </button>


                </div>

            </div>


            <div
                *ngIf="mensagemErro"
                class="mb-4 text-red-600 text-sm">

                {{ mensagemErro }}

            </div>


            <button
                type="submit"
                [disabled]="carregando"
                class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition disabled:opacity-50">


                {{ carregando ? 'Entrando...' : 'Entrar' }}


            </button>


        </form>


    </div>

</div>
```
