<div class="min-h-screen flex items-center justify-center bg-gray-100">

    <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">
                Reis Portal
            </h1>
            <p class="text-gray-500 mt-2">
                Acesse sua conta
            </p>
        </div>
        <form (ngSubmit)="entrar()">
            <div class="mb-4">
                <label
                    for="username"
                    class="block text-sm font-medium text-gray-700">
                    Usuário
                </label>
                <input
                    id="username"
                    type="text"
                    name="username"
                    [(ngModel)]="username"
                    class="mt-1 w-full rounded-lg border border-gray-300 p-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Digite seu usuário"
                    autocomplete="username">
            </div>
            <div class="mb-6">
                <label
                    for="senha"
                    class="block text-sm font-medium text-gray-700">
                    Senha
                </label>
                <div class="relative">
                    <input
                        id="senha"
                        [type]="mostrarSenha ? 'text' : 'password'"
                        name="senha"
                        [(ngModel)]="senha"
                        class="mt-1 w-full rounded-lg border border-gray-300 p-3 pr-12 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                        placeholder="Digite sua senha"
                        autocomplete="current-password">
                    <button
                        type="button"
                        (click)="mostrarSenha = !mostrarSenha"
                        class="absolute inset-y-0 right-0 flex items-center px-3 text-gray-500 hover:text-blue-600">
                        <lucide-icon
                            *ngIf="!mostrarSenha"
                            [img]="Eye"
                            size="20">
                        </lucide-icon>
                        <lucide-icon
                            *ngIf="mostrarSenha"
                            [img]="EyeOff"
                            size="20">
                        </lucide-icon>
                    </button>
                </div>
            </div>
            <div
                *ngIf="mensagemErro"
                class="mb-5 rounded-lg border border-red-300 bg-red-50 p-3 text-sm text-red-700">
                {{ mensagemErro }}
            </div>
            <button
                type="submit"
                [disabled]="carregando"
                class="w-full rounded-lg bg-blue-600 py-3 text-white font-medium transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-50">
                {{ carregando ? 'Entrando...' : 'Entrar' }}
            </button>
        </form>
        <div class="mt-6 flex flex-col items-center gap-3">
            <a
                routerLink="/recuperar-senha"
                class="text-sm text-gray-500 transition hover:text-blue-600">
                Esqueci minha senha
            </a>
            <a
                routerLink="/cadastro"
                class="text-sm font-semibold text-blue-600 transition hover:text-blue-700 hover:underline">
                Cadastrar
            </a>
        </div>
    </div>
</div>
